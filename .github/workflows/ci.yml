name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit (high+critical)
        run: pnpm run audit

      - name: Type and content checks
        run: pnpm astro check

      - name: Check content asset references
        run: pnpm run check:assets

      - name: Install browser for regression tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Cookie consent browser regression tests
        run: pnpm run test:browser

      - name: Build
        run: pnpm build
