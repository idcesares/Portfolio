name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit (high+critical)
        run: pnpm run audit

      - name: Type and content checks
        run: pnpm astro check

      - name: Check content asset references
        run: pnpm run check:assets

      - name: Membrane conformance
        run: pnpm run check:membrane

      - name: Install browser for regression tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser regression tests (axe, Membrane, keyboard, consent)
        run: pnpm run test:browser

      - name: Build
        run: pnpm build
